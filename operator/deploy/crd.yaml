apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: noderefreshes.stable.rk.ai
spec:
  group: stable.rk.ai
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            # Desired state
            spec:
              type: object
              required:
                - targetNodeLabels
                - gkeConfig
              properties:
                gkeConfig:
                  type: object
                  required: ["projectId", "zone", "clusterId", "nodePoolId"]
                  properties:
                    projectId: { type: string }
                    zone: { type: string }
                    clusterId: { type: string }
                    nodePoolId: { type: string }
                targetNodeLabels:
                  type: object
                  additionalProperties:
                    type: string
                maxConcurrentMigrations:
                  type: integer
                  minimum: 1
                  default: 2
                minHealthyPercent:
                  type: integer
                  minimum: 1
                  default: 99
                refreshSchedule:
                  type: string
                  description: "Cron-style schedule (optional)"
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      # CLI Formatting
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Generation
          type: integer
          jsonPath: .status.activeGeneration # Monitor the auto-incrementing version
        - name: Failures
          type: integer
          jsonPath: .status.failureCount  # Monitor the circuit breaker
        - name: Remaining
          type: integer
          jsonPath: .status.remainingNodes
  names:
    plural: noderefreshes
    singular: noderefresh
    kind: NodeRefresh
    shortNames:
      - nr